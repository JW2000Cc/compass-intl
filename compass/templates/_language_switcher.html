{# Reusable language switcher dropdown — drop into any template header. #}
<div class="vs-lang-switch" data-current="{{ current_locale }}">
  <button type="button" class="vs-lang-btn" aria-haspopup="true" aria-expanded="false"
          onclick="this.parentElement.classList.toggle('open')">
    <span class="vs-lang-flag">{{ language_flags[current_locale] }}</span>
    <span class="vs-lang-name">{{ language_names[current_locale] }}</span>
    <span class="vs-lang-caret">▾</span>
  </button>
  <ul class="vs-lang-menu" role="menu">
    {% for code in supported_locales %}
    <li role="menuitem">
      <a href="{{ url_for('set_language', lang=code, next=request.full_path) }}"
         class="{% if code == current_locale %}active{% endif %}">
        <span class="vs-lang-flag">{{ language_flags[code] }}</span>
        <span class="vs-lang-name">{{ language_names[code] }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
<style>
  .vs-lang-switch { position: relative; display: inline-block; font-size: 13px; }
  .vs-lang-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid rgba(255,255,255,0.15);
    color: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    font: inherit; line-height: 1;
  }
  .vs-lang-btn:hover { border-color: rgba(255,255,255,0.35); }
  .vs-lang-caret { font-size: 10px; opacity: 0.7; }
  .vs-lang-menu {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    min-width: 160px; background: #1a2038; color: #dde4f2;
    border: 1px solid #232848; border-radius: 8px;
    list-style: none; margin: 0; padding: 4px 0; z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .vs-lang-switch.open .vs-lang-menu { display: block; }
  .vs-lang-menu a {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; text-decoration: none; color: inherit;
  }
  .vs-lang-menu a:hover { background: rgba(91,140,245,0.12); }
  .vs-lang-menu a.active { color: #5b8cf5; font-weight: 600; }
  .vs-lang-flag { font-size: 16px; line-height: 1; }
</style>
